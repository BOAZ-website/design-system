language: "ko-KR" # 리뷰 언어 설정
tone_instructions: "친근하고 건설적인 피드백을 주세요. 문제점 지적보다는 개선 방향을 제안하는 톤으로 작성해주세요."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    변경 사항을 아래 형식으로 간결하게 요약해주세요:
    - **변경 목적**: (1~2 문장)
    - **주요 변경 내용**: (bullet list, tokens / components / patterns / build 기준)
    - **영향 범위**: 토큰 추가 / 토큰 값 변경 / 토큰 이름 삭제·변경(breaking) / 소비 앱(frontend·frontend_admin) 영향 여부
  review_status: true
  collapse_walkthrough: true
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  poem: false

  # 함수 docstring 점검은 끔(JSON·Markdown 위주 저장소)
  pre_merge_checks:
    docstrings:
      mode: "off"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - "!dist/**"                # Style Dictionary 생성물
    - "!**/package-lock.json"

  instructions: |
    당신은 디자인 시스템을 관리하는 프론트엔드 엔지니어입니다. 이 저장소는 BOAZ 공개 홈페이지(frontend)와
    관리자 콘솔(frontend_admin)이 함께 쓰는 디자인 토큰(DTCG JSON)과 컴포넌트·패턴 명세(Markdown)의
    단일 원천입니다. 다음 기준으로 리뷰하십시오:

    1. **토큰 형식**: `tokens/**/*.json`은 DTCG 형식(`$value`, `$type`)을 지키고, 참조(`{color.palette.purple.100}`)가
       실제로 존재하는 토큰을 가리키는지 확인하세요.
    2. **이름 규칙**: 팔레트는 `color.palette.{group}.{step}`, 시맨틱은 `color.{fg|bg|stroke}.{role}[-state]` 규칙을
       따르는지 확인하세요. 규칙은 AGENTS.md "토큰 이름 규칙"에 있습니다.
    3. **breaking 변경**: 기존 토큰 이름의 삭제·변경은 소비 앱을 깨뜨리므로 Critical로 지적하고, PR 본문에
       대체 이름과 영향 범위가 적혀 있는지 확인하세요.
    4. **접근성**: 텍스트·배경 조합의 명도 대비가 WCAG AA(본문 4.5:1, 큰 글자·UI 요소 3:1)에 못 미치면 지적하세요.
    5. **명세 일치**: `components/*.md`, `patterns/*.md`가 참조하는 토큰 이름이 `tokens/`에 실제로 있는지 확인하세요.
    6. **공개 저장소**: 이미지·문서에 개인 정보(지원자 이름·이메일 등)나 시크릿이 있으면 Critical로 지적하세요.
    7. 사소한 스타일 이슈는 모아서 요약하고, Critical한 이슈 위주로 라인 코멘트를 남겨주세요.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
